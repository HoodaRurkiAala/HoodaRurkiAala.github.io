<section id="vault">
    <h2>🔐 Secure File Locker (Short Code)</h2>
    
    <div class="vault-box">
        <div class="form-group">
            <label for="file-input">1. Select Any File *</label>
            <input type="file" id="file-input">
        </div>
        <div class="form-group">
            <label for="secret-pin">2. Create a Secret PIN *</label>
            <input type="text" id="secret-pin" placeholder="Example: 1234 or HOODA" maxlength="20">
        </div>
        <button type="button" class="btn" id="upload-btn" onclick="startUpload()">Upload & Generate Code</button>
        <div id="upload-status" class="status-msg"></div>

        <!-- RESULT -->
        <div id="qr-output" class="qr-result" style="display:none;">
            <h3 style="color:#065f46; margin-bottom:12px;">✅ Your Short Code is Ready!</h3>
            <div style="font-size:2.4rem; font-weight:bold; color:#059669; letter-spacing:4px; margin:15px 0;" id="short-code-display">------</div>
            <p style="color:#475569; font-size:0.95rem;">Yeh Short Code + PIN dusri device pe daalo</p>
        </div>
    </div>

    <!-- UNLOCK -->
    <div class="vault-box">
        <h3 style="color:#065f46; margin-bottom:12px;">🔓 Unlock File</h3>
        <p style="font-size:0.95rem; color:#475569; margin-bottom:16px;">
            Short Code + PIN daalo
        </p>

        <div class="form-group">
            <label for="unlock-code">Enter 6-digit Short Code *</label>
            <input type="text" id="unlock-code" placeholder="Example: A7K2M9" maxlength="6" style="text-transform:uppercase; letter-spacing:2px; font-size:1.2rem; text-align:center;">
        </div>
        <div class="form-group">
            <label for="unlock-pin">Enter Secret PIN *</label>
            <input type="text" id="unlock-pin" placeholder="Same PIN">
        </div>
        <button type="button" class="btn" onclick="startUnlock()">Unlock & Download</button>
        <div id="unlock-status" class="status-msg"></div>
    </div>
</section>
